  <rect x="73" y="170" width="44" height="44" rx="6" fill="#ffffff"/>
  <rect x="81" y="178" width="28" height="28" rx="4" fill="#0f172a"/>
  
  <!-- Top Right -->
  <rect x="275" y="162" width="60" height="60" rx="10" fill="#0f172a"/>
  <rect x="283" y="170" width="44" height="44" rx="6" fill="#ffffff"/>
  <rect x="291" y="178" width="28" height="28" rx="4" fill="#0f172a"/>
  
  <!-- Bottom Left -->

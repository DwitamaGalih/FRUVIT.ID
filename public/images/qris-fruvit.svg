<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Card Background -->
  <rect width="400" height="480" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Header Banner -->
  <path d="M 0 20 Q 0 0 20 0 L 380 0 Q 400 0 400 20 L 400 70 L 0 70 Z" fill="url(#headerGrad)"/>
  
  <!-- QRIS Header Text -->
  <text x="200" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">QRIS</text>
  <text x="200" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#dcfce7" text-anchor="middle" letter-spacing="1">QR KODE STANDAR PEMBAYARAN NASIONAL</text>
  
  <!-- Merchant Info -->
  <rect x="20" y="80" width="360" height="52" rx="10" fill="#f8fafc" stroke="#f1f5f9"/>
  <text x="200" y="102" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">FRUVIT.ID - KEWIRAUSAHAAN</text>
  <text x="200" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">NMID : ID1020261117001</text>
  
  <!-- QR Code Frame -->
  <rect x="45" y="142" width="310" height="280" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- QR Pattern Corner Finder Patterns -->

    <rect x="260" y="335" width="10" height="20" rx="2"/><rect x="285" y="340" width="20" height="10" rx="2"/><rect x="315" y="335" width="20" height="10" rx="2"/>
    <rect x="140" y="365" width="10" height="20" rx="2"/><rect x="165" y="370" width="20" height="10" rx="2"/><rect x="200" y="360" width="10" height="20" rx="2"/><rect x="225" y="365" width="20" height="10" rx="2"/>
    <rect x="260" y="370" width="20" height="10" rx="2"/><rect x="290" y="365" width="10" height="20" rx="2"/><rect x="315" y="370" width="20" height="10" rx="2"/>
    <rect x="140" y="395" width="20" height="10" rx="2"/><rect x="175" y="395" width="10" height="10" rx="2"/><rect x="200" y="390" width="20" height="15" rx="2"/><rect x="235" y="395" width="15" height="10" rx="2"/>
    <rect x="260" y="395" width="20" height="10" rx="2"/><rect x="290" y="395" width="20" height="10" rx="2"/><rect x="325" y="395" width="10" height="10" rx="2"/>

    <rect x="260" y="235" width="20" height="15" rx="2"/><rect x="290" y="225" width="15" height="20" rx="2"/><rect x="320" y="240" width="15" height="15" rx="2"/>
    <rect x="65" y="270" width="20" height="10" rx="2"/><rect x="100" y="270" width="10" height="20" rx="2"/><rect x="125" y="260" width="15" height="10" rx="2"/>
    <rect x="265" y="265" width="15" height="15" rx="2"/><rect x="295" y="270" width="20" height="10" rx="2"/><rect x="325" y="265" width="10" height="20" rx="2"/>
    <rect x="65" y="305" width="15" height="15" rx="2"/><rect x="95" y="305" width="20" height="10" rx="2"/><rect x="130" y="295" width="10" height="20" rx="2"/>
    <rect x="260" y="305" width="20" height="10" rx="2"/><rect x="295" y="295" width="10" height="20" rx="2"/><rect x="320" y="305" width="15" height="15" rx="2"/>
    <!-- Bottom Right block -->

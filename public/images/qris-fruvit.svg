    <rect x="140" y="162" width="10" height="10" rx="2"/><rect x="160" y="162" width="10" height="10" rx="2"/><rect x="190" y="162" width="20" height="10" rx="2"/><rect x="230" y="162" width="10" height="10" rx="2"/><rect x="250" y="162" width="10" height="10" rx="2"/>
    <!-- Row 2 -->
